<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT Proxy Player</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --accent: #ff4444;
    --text: #e8e8e8;
    --muted: #888;
    --radius: 8px;
    --font: 'Inter', system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }

  .badge {
    font-size: 10px;
    background: var(--border);
    color: var(--muted);
    padding: 2px 7px;
    border-radius: 20px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  main {
    width: 100%;
    max-width: 960px;
    padding: 32px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Search */
  .search-row {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 12px 16px;
    font-size: 15px;
    font-family: var(--font);
    outline: none;
    transition: border-color .15s;
  }

  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--muted); }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    transition: opacity .15s;
    white-space: nowrap;
  }

  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: default; }

  /* Status */
  .status { font-size: 13px; color: var(--muted); min-height: 18px; }
  .status.error { color: var(--accent); }

  /* Search results grid */
  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color .15s, transform .1s;
  }

  .result-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .result-card img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
    background: #111;
  }

  .result-card .card-info {
    padding: 10px 12px;
  }

  .result-card .card-title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 5px;
  }

  .result-card .card-meta {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }

  /* Player card */
  .player-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: none;
  }

  .player-card.visible { display: block; }

  video {
    width: 100%;
    display: block;
    background: #000;
    max-height: 500px;
  }

  .player-meta {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .video-info .title { font-size: 15px; font-weight: 600; line-height: 1.4; margin-bottom: 4px; }
  .video-info .author { font-size: 12px; color: var(--muted); }

  .quality-row { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }

  .q-btn {
    background: var(--border);
    color: var(--muted);
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 20px;
    transition: background .15s, color .15s;
  }

  .q-btn:hover { background: #333; color: var(--text); }
  .q-btn.active { background: var(--accent); color: #fff; }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    margin-top: auto;
    padding: 24px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <div class="logo">yt<span>proxy</span></div>
  <span class="badge">Fly.io</span>
</header>

<main>

  <!-- Search -->
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Search YouTube or paste a URL / video ID…" />
    <button id="searchBtn" onclick="handleSearch()">Search</button>
  </div>

  <div class="status" id="status"></div>

  <!-- Player -->
  <div class="player-card" id="playerCard">
    <video id="player" controls></video>
    <div class="player-meta">
      <div class="video-info">
        <div class="title" id="videoTitle"></div>
        <div class="author" id="videoAuthor"></div>
      </div>
      <div class="quality-row" id="qualityRow"></div>
    </div>
  </div>

  <!-- Search results -->
  <div class="results-grid" id="resultsGrid"></div>

</main>

<footer>Streams proxied via Fly.io · search via YouTube Data API · no data stored</footer>

<script>
const WORKER_URL = "https://stops-sjdng.fly.dev";
const YT_API_KEY = "AIzaSyBA6PhU8lGOVG8Et1GXqFHSNQXr3Cku0Og";

(function init() {
  const params = new URLSearchParams(location.search);
  document.getElementById("searchInput").addEventListener("keydown", e => {
    if (e.key === "Enter") handleSearch();
  });
  if (params.get("v")) {
    document.getElementById("searchInput").value = params.get("v");
    loadVideoById(params.get("v"));
  }
})();

function extractVideoId(input) {
  input = input.trim();
  if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
  try {
    const u = new URL(input);
    if (u.hostname.includes("youtu.be")) return u.pathname.slice(1, 12);
    return u.searchParams.get("v") || null;
  } catch { return null; }
}

function setStatus(msg, isError = false) {
  const el = document.getElementById("status");
  el.innerHTML = msg;
  el.className = "status" + (isError ? " error" : "");
}

// Decide: direct video load or search
function handleSearch() {
  const raw = document.getElementById("searchInput").value.trim();
  if (!raw) return;
  const videoId = extractVideoId(raw);
  if (videoId) {
    loadVideoById(videoId);
  } else {
    searchVideos(raw);
  }
}

// ── Search via YouTube Data API v3 ───────────────────────────────────────────
async function searchVideos(query) {
  document.getElementById("searchBtn").disabled = true;
  document.getElementById("resultsGrid").innerHTML = "";
  document.getElementById("playerCard").classList.remove("visible");
  setStatus('<span class="spinner"></span>Searching…');

  try {
    // 1. Search for video IDs
    const searchRes = await fetch(
      `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=20&q=${encodeURIComponent(query)}&key=${YT_API_KEY}`
    );
    const searchData = await searchRes.json();
    if (searchData.error) throw new Error(searchData.error.message);

    const items = searchData.items || [];
    if (items.length === 0) { setStatus("No results found.", true); return; }

    // 2. Fetch durations in one batch videos call
    const ids = items.map(i => i.id.videoId).join(",");
    const vidRes = await fetch(
      `https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${ids}&key=${YT_API_KEY}`
    );
    const vidData = await vidRes.json();
    const durationMap = {};
    for (const v of (vidData.items || [])) {
      durationMap[v.id] = parseDuration(v.contentDetails.duration);
    }

    setStatus(`${items.length} results`);
    renderResults(items, durationMap);
  } catch (err) {
    setStatus("Search error: " + err.message, true);
  } finally {
    document.getElementById("searchBtn").disabled = false;
  }
}

function renderResults(items, durationMap) {
  const grid = document.getElementById("resultsGrid");
  grid.innerHTML = "";

  for (const item of items) {
    const videoId = item.id.videoId;
    const snippet = item.snippet;
    const thumb = snippet.thumbnails?.medium?.url || snippet.thumbnails?.default?.url
      || `https://i.ytimg.com/vi/${videoId}/mqdefault.jpg`;
    const duration = durationMap[videoId] || 0;

    const card = document.createElement("div");
    card.className = "result-card";
    card.innerHTML = `
      <img src="${thumb}" alt="" loading="lazy">
      <div class="card-info">
        <div class="card-title">${escHtml(snippet.title)}</div>
        <div class="card-meta">
          <span>${escHtml(snippet.channelTitle)}</span>
          <span>${formatDuration(duration)}</span>
        </div>
      </div>
    `;
    card.onclick = () => loadVideoById(videoId);
    grid.appendChild(card);
  }
}

// Parse ISO 8601 duration (PT4M13S) → seconds
function parseDuration(iso) {
  if (!iso) return 0;
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m) return 0;
  return (parseInt(m[1]||0)*3600) + (parseInt(m[2]||0)*60) + parseInt(m[3]||0);
}

// ── Load & play a video ───────────────────────────────────────────────────────
let currentStreams = {};

async function loadVideoById(videoId) {
  document.getElementById("playerCard").classList.remove("visible");
  setStatus('<span class="spinner"></span>Fetching streams…');
  document.getElementById("searchBtn").disabled = true;

  try {
    const res = await fetch(`${WORKER_URL}/info?v=${videoId}`);
    const data = await res.json();

    if (data.error) throw new Error(data.error);
    if (!data.streams || Object.keys(data.streams).length === 0) {
      throw new Error("No playable streams found for this video.");
    }

    currentStreams = data.streams;

    document.getElementById("videoTitle").textContent = data.title;
    document.getElementById("videoAuthor").textContent =
      data.author + (data.duration ? ` · ${formatDuration(data.duration)}` : "");

    const preferOrder = ["720p", "1080p", "360p"];
    const defaultQ = preferOrder.find(q => currentStreams[q]) || Object.keys(currentStreams)[0];

    renderQualityButtons(Object.keys(currentStreams), defaultQ);
    setVideoSource(defaultQ);

    document.getElementById("playerCard").classList.add("visible");
    document.getElementById("player").scrollIntoView({ behavior: "smooth", block: "start" });
    setStatus(`Playing · ${defaultQ}`);
  } catch (err) {
    setStatus("Error: " + err.message, true);
  } finally {
    document.getElementById("searchBtn").disabled = false;
  }
}

function renderQualityButtons(qualities, active) {
  const row = document.getElementById("qualityRow");
  row.innerHTML = "";
  const order = ["360p", "720p", "1080p"];
  const sorted = order.filter(q => qualities.includes(q));
  for (const q of sorted) {
    const btn = document.createElement("button");
    btn.className = "q-btn" + (q === active ? " active" : "");
    btn.textContent = q;
    btn.onclick = () => switchQuality(q);
    row.appendChild(btn);
  }
}

function switchQuality(quality) {
  if (!currentStreams[quality]) return;
  const video = document.getElementById("player");
  const time = video.currentTime;
  const wasPlaying = !video.paused;
  setVideoSource(quality);
  video.addEventListener("loadedmetadata", () => {
    video.currentTime = time;
    if (wasPlaying) video.play().catch(() => {});
  }, { once: true });
  document.querySelectorAll(".q-btn").forEach(b => {
    b.classList.toggle("active", b.textContent === quality);
  });
  setStatus(`Playing · ${quality}`);
}

function setVideoSource(quality) {
  const stream = currentStreams[quality];
  const video = document.getElementById("player");
  video.src = stream.proxyUrl;
  video.type = stream.mimeType;
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function formatDuration(seconds) {
  if (!seconds) return "";
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${m}:${String(s).padStart(2,"0")}`;
}

function escHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
</script>
</body>
</html>
